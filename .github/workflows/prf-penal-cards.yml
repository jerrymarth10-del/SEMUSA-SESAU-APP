name: Checkout individual PRF/Polícia Penal e combo WhatsApp
on:
  pull_request:
    branches: [main]
    paths: ['index.html', 'banners/**', '.github/workflows/prf-penal-cards.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout antigo preservado + novos cards + scripts válidos
        run: |
          node - <<'NODE'
          const fs = require('fs'), vm = require('node:vm'), assert = require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          for(const code of ['prf','penal']) {
            assert.ok(html.includes('name="area" value="'+code+'"'));
            assert.ok(html.includes('data-jr-pick-area="'+code+'"'));
          }
          assert.match(html,/wa\.me\/5569993539150\?text=/);
          const cardsStart=html.indexOf('id="jr-exam-switch-v1"');
          const cardsEnd=html.indexOf('<div class="container hero-grid">', cardsStart);
          assert.ok(cardsStart>0 && cardsEnd>cardsStart);
          const cardsHtml=html.slice(cardsStart,cardsEnd);
          assert.ok(!/R\\$\\s*(129|197)[,.]/.test(cardsHtml),'Preços não podem aparecer nos cinco cards');
          assert.ok(cardsHtml.includes('<small>Ver preparatório</small>'));
          assert.ok(cardsHtml.includes('<small>Falar no WhatsApp</small>'));
          const base64Images=[...cardsHtml.matchAll(new RegExp('<img class="jr-exam-thumbnail" src="data:image/jpeg;base64,([A-Za-z0-9+/=]+)"','g'))];
          assert.equal(base64Images.length,3,'Três imagens novas devem estar em JPEG Base64 no HTML');
          for(const im of base64Images){
            const bytes=Buffer.from(im[1],'base64');
            assert.ok(bytes.length>=5000 && bytes.length<90000);
            assert.equal(bytes[0],0xff);assert.equal(bytes[1],0xd8);assert.equal(bytes[2],0xff);
          }
          // Os três cards adicionais ficam no mesmo seletor responsivo dos cards originais.
          const start=html.indexOf('<div class="jr-exam-switch-actions">');
          const end=html.indexOf('<div class="container hero-grid">',start);
          assert.ok(start>0 && end>start,'Seletor de concursos deve existir');
          const cards=html.slice(start,end);
          for(const name of ['prf','penal']) assert.match(cards,new RegExp('class="jr-exam-choice jr-extra-choice" data-jr-pick-area="'+name+'"'));
          assert.match(cards,/jr-exam-choice jr-extra-choice is-combo/);
          assert.ok(!html.includes('jr-course-grid'),'Grade independente com imagem esticada removida');
          assert.ok(!html.includes('grid-row:1\/4'),'Imagem não pode abranger altura total do card');
          assert.match(html,/\.jr-exam-choice\.jr-extra-choice \.jr-exam-thumbnail\{[^}]*aspect-ratio:16\/9/);
          assert.match(html,/R\$ 129,90/);
          assert.match(html,/fetch\('\/api\/checkout'/);
          assert.match(html,/id="checkoutForm"/);
          assert.match(html,/infinitepay-payment\.js/);
          assert.match(html,/card-payment\.js/);
          assert.ok(!html.includes('value="combo"'));
          for(const image of ['prf-administrativa','policia-penal','combo-semusa-sesau']){
            const file='banners/'+image+'.svg'; assert.ok(fs.existsSync(file));assert.ok(fs.statSync(file).size>1500);
          }
          let scripts=0;
          const re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          for(const match of html.matchAll(re)){
            if(!match[1].includes('src=')){ new vm.Script(match[2],{filename:'inline-script-'+(++scripts)+'.js'}); }
          }
          assert.ok(scripts>=5);
          console.log('PASS: HTML scripts, individual pricing, WhatsApp-only combo, preserved checkout, assets');
          NODE
