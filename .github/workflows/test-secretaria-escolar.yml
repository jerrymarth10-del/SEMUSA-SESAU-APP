name: Teste Secretaria Escolar Landing
on:
  push:
    branches: [feat/secretaria-escolar-semed-20261016]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-secretaria-escolar.cjs
